<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <!-- Paper white, ink black, one red. Straight lines only: no radius, no
       gradient, no shadow. Red is reserved for the one thing that matters on
       the surface — today's action. -->
  <rect width="640" height="360" fill="#FFFFFF"/>

  <!-- wordmark -->
  <rect x="40" y="34" width="14" height="14" fill="#D0021B"/>
  <rect x="44" y="52" width="6" height="20" fill="#101010"/>
  <text x="70" y="49" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#101010" letter-spacing="3.4">PRAYER ROOM</text>

  <!-- headline -->
  <text x="40" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="800" fill="#101010" letter-spacing="-0.5">Моліться разом.</text>
  <text x="40" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="800" fill="#D0021B" letter-spacing="-0.5">Щодня.</text>

  <rect x="40" y="222" width="56" height="3" fill="#101010"/>

  <text x="40" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4A4A4A">Приватна кімната молитви у Telegram:</text>
  <text x="40" y="276" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4A4A4A">теми, нагадування, підтримка групи.</text>

  <rect x="40" y="304" width="320" height="1" fill="#DADADA"/>
  <text x="40" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#8A8A8A" letter-spacing="1.6">БЕЗ РЕКЛАМИ · ВІДКРИТИЙ КОД · ТІЛЬКИ СВОЇ</text>

  <!-- right panel -->
  <rect x="400" y="0" width="240" height="360" fill="#101010"/>

  <text x="428" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#8A8A8A" letter-spacing="2">СЬОГОДНІ</text>

  <rect x="428" y="70" width="184" height="1" fill="#333333"/>
  <rect x="428" y="86" width="8" height="8" fill="#D0021B"/>
  <text x="448" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#FFFFFF">Мир в Україні</text>
  <text x="448" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8A8A8A" letter-spacing="1.2">СПІЛЬНА ТЕМА</text>

  <rect x="428" y="132" width="184" height="1" fill="#333333"/>
  <rect x="428" y="148" width="8" height="8" fill="#D0021B"/>
  <text x="448" y="156" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#FFFFFF">Здоров'я мами Олі</text>
  <text x="448" y="174" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8A8A8A" letter-spacing="1.2">ОСОБИСТЕ ПРОХАННЯ</text>

  <rect x="428" y="194" width="184" height="1" fill="#333333"/>

  <!-- primary action -->
  <rect x="428" y="216" width="184" height="44" fill="#D0021B"/>
  <text x="520" y="243" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="0.6">ПОМОЛИВСЯ СЬОГОДНІ</text>

  <!-- week strip -->
  <text x="428" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#8A8A8A" letter-spacing="2">СЕРІЯ 6</text>
  <g>
    <rect x="428" y="308" width="22" height="6" fill="#D0021B"/>
    <rect x="455" y="308" width="22" height="6" fill="#D0021B"/>
    <rect x="482" y="308" width="22" height="6" fill="#D0021B"/>
    <rect x="509" y="308" width="22" height="6" fill="#D0021B"/>
    <rect x="536" y="308" width="22" height="6" fill="#D0021B"/>
    <rect x="563" y="308" width="22" height="6" fill="#D0021B"/>
    <rect x="590" y="308" width="22" height="6" fill="#3A3A3A"/>
  </g>
</svg>
