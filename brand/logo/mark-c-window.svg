<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- C — Window. A solid red field split by two white gaps: a window, and the
       cross it makes is read rather than drawn. Maximum contrast at 20px. -->
  <rect width="512" height="512" fill="#FFFFFF"/>
  <rect x="126" y="126" width="260" height="260" fill="#D0021B"/>

  <!-- the gaps -->
  <rect x="239" y="126" width="34" height="260" fill="#FFFFFF"/>
  <rect x="126" y="222" width="260" height="34" fill="#FFFFFF"/>
</svg>
