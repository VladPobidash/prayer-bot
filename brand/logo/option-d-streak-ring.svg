<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#141735"/>
      <stop offset="1" stop-color="#241A46"/>
    </linearGradient>
    <linearGradient id="ringD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD469"/>
      <stop offset="1" stop-color="#FF7A45"/>
    </linearGradient>
    <linearGradient id="sunD" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="1" stop-color="#FF9A3C"/>
    </linearGradient>
    <radialGradient id="glowD" cx="0.5" cy="0.62" r="0.42">
      <stop offset="0" stop-color="#FFB03A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFB03A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bgD)"/>
  <circle cx="256" cy="290" r="210" fill="url(#glowD)"/>

  <!-- 7-day streak ring: 6 lit, 1 waiting -->
  <g fill="none" stroke-linecap="round" stroke-width="22">
    <g stroke="url(#ringD)">
      <path d="M256 76 A180 180 0 0 1 411.9 166"/>
      <path d="M419.6 179.3 A180 180 0 0 1 419.6 332.7"/>
      <path d="M411.9 346 A180 180 0 0 1 279 434.5"/>
      <path d="M256 436 A180 180 0 0 1 100.1 346"/>
      <path d="M92.4 332.7 A180 180 0 0 1 92.4 179.3"/>
      <path d="M100.1 166 A180 180 0 0 1 233 77.5"/>
    </g>
  </g>

  <!-- horizon + rising sun (daily rhythm) -->
  <path d="M256 158 A88 88 0 0 1 344 246 H168 A88 88 0 0 1 256 158 Z" fill="url(#sunD)"/>
  <g stroke="#FFD469" stroke-width="14" stroke-linecap="round">
    <path d="M140 288 H372"/>
    <path d="M172 336 H340" opacity="0.65"/>
    <path d="M204 384 H308" opacity="0.4"/>
  </g>
</svg>
