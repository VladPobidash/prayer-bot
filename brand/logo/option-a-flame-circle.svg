<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1F4B"/>
      <stop offset="0.55" stop-color="#141735"/>
      <stop offset="1" stop-color="#0B0D20"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.56" r="0.45">
