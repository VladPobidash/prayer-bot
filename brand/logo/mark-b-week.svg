<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- B — Week. Seven days as seven bars; today is the red one. The product's
       core promise (one day at a time, kept together) as a mark. -->
  <rect width="512" height="512" fill="#F4F2EF"/>

  <g fill="#101010">
    <rect x="132" y="176" width="20" height="180"/>
    <rect x="170" y="176" width="20" height="180"/>
    <rect x="208" y="176" width="20" height="180"/>
    <rect x="246" y="176" width="20" height="180"/>
    <rect x="284" y="176" width="20" height="180"/>
    <rect x="322" y="176" width="20" height="180"/>
  </g>
  <rect x="360" y="156" width="20" height="200" fill="#D0021B"/>

  <rect x="132" y="380" width="248" height="8" fill="#101010"/>
</svg>
